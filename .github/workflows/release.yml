name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # The tag, package.json and the plugin's meta.json must agree, or the image and the plugin would ship
      # under different numbers.
      - id: check
        run: |
          tag=${GITHUB_REF_NAME#v}
          app=$(jq -r .version package.json)
          plugin=$(jq -r .version plugin/meta.json)
          if [ "$app" != "$tag" ] || [ "$plugin" != "$tag.0" ]; then
            echo "::error::Tag $tag, package.json $app and plugin/meta.json $plugin don't match"
            exit 1
          fi
          grep -q "^## $tag\$" CHANGELOG.md || { echo "::error::No '## $tag' section in CHANGELOG.md"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  image:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/stubbert
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  plugin:
    needs: [versions, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.versions.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: bash plugin/pack.sh
      - name: Create the GitHub release
        run: |
          awk -v h="## $VERSION" '$0==h{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "plugin/dist/Stubbert_$VERSION.0.zip" \
            --title "Stubbert $VERSION" --notes-file notes.md
      # Jellyfin reads manifest.json from main, so the new version only shows up in the catalog once it's committed.
      - name: Add the version to manifest.json
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Stubbert_$VERSION.0.zip"
          bash plugin/manifest.sh "$url" "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add plugin $VERSION to manifest.json"
          git push origin main
